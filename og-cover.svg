<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#0F9D58"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
    <!-- subtle vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <!-- spreadsheet pattern -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <!-- glow for accent -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- decorative spreadsheet cells (left side) -->
  <g opacity="0.85">
    <rect x="80" y="120" width="120" height="50" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="210" y="120" width="120" height="50" rx="6" fill="#FFB400" fill-opacity="0.18" stroke="#FFB400" stroke-opacity="0.55"/>
    <rect x="80" y="180" width="120" height="50" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="210" y="180" width="120" height="50" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
  </g>

  <!-- formula bar mock -->
  <g transform="translate(80, 410)">
    <rect width="380" height="44" rx="8" fill="#0E1726" stroke="#FFB400" stroke-opacity="0.6"/>
    <text x="20" y="28" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="16" fill="#FFB400">fx</text>
    <text x="60" y="28" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="16" fill="#F7F9FC">=QUEST(skills, "level_up")</text>
  </g>

  <!-- main title -->
  <g>
    <text x="80" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#F7F9FC" letter-spacing="-2">
      Excel-Quest
    </text>
    <text x="80" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#FFB400">
      Învață Excel ca într-un joc
    </text>
  </g>

  <!-- right-side decorative XP badge -->
  <g transform="translate(950, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="130" fill="#FFB400" fill-opacity="0.12" stroke="#FFB400" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="0" cy="0" r="95" fill="#FFB400" fill-opacity="0.18"/>
    <text x="0" y="-15" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="22" fill="#FFB400" font-weight="700">LEVEL</text>
    <text x="0" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="86" font-weight="700" fill="#FFB400">∞</text>
  </g>

  <!-- feature pills bottom (SVG icons instead of emoji for cross-platform consistency) -->
  <g transform="translate(80, 510)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500">
    <!-- Lecții (lightning bolt) -->
    <g>
      <rect width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
      <path d="M 22 13 L 17 24 L 21 24 L 19 31 L 26 19 L 22 19 Z" fill="#FFB400"/>
      <text x="42" y="27" fill="#F7F9FC">Lecții</text>
    </g>
    <!-- Quest-uri (target) -->
    <g transform="translate(165, 0)">
      <rect width="170" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
      <circle cx="22" cy="21" r="9" fill="none" stroke="#FFB400" stroke-width="2"/>
      <circle cx="22" cy="21" r="4" fill="none" stroke="#FFB400" stroke-width="2"/>
      <circle cx="22" cy="21" r="1.5" fill="#FFB400"/>
      <text x="40" y="27" fill="#F7F9FC">Quest-uri</text>
    </g>
    <!-- Certificare (medal) -->
    <g transform="translate(350, 0)">
      <rect width="180" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
      <circle cx="22" cy="20" r="8" fill="none" stroke="#FFB400" stroke-width="2"/>
      <path d="M 18 27 L 16 33 L 22 30 L 28 33 L 26 27" fill="none" stroke="#FFB400" stroke-width="2" stroke-linejoin="round"/>
      <text x="40" y="27" fill="#F7F9FC">Certificare</text>
    </g>
    <!-- Formula Vault (sigma) -->
    <g transform="translate(545, 0)">
      <rect width="200" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="16" y="29" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FFB400">Σ</text>
      <text x="36" y="27" fill="#F7F9FC">Formula Vault</text>
    </g>
  </g>

  <!-- corner brand -->
  <g transform="translate(1020, 590)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#F7F9FC" fill-opacity="0.7">
    <text x="0" y="0">by Laura Andreea</text>
  </g>
</svg>
