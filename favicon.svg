<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .bg { fill: #0F9D58; }
    .grid { fill: #ffffff; opacity: 0.18; }
    .cell-active { fill: #FFB400; }
    .x-mark { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B1F3A; }
      .grid { fill: #5B8DEF; opacity: 0.22; }
      .cell-active { fill: #FFB400; }
      .x-mark { fill: #F7F9FC; }
    }
  </style>
  <!-- rounded background -->
  <rect class="bg" x="0" y="0" width="64" height="64" rx="14" ry="14"/>
  <!-- spreadsheet grid lines -->
  <g class="grid">
    <rect x="8" y="20" width="48" height="1.5"/>
    <rect x="8" y="32" width="48" height="1.5"/>
    <rect x="8" y="44" width="48" height="1.5"/>
    <rect x="20" y="8" width="1.5" height="48"/>
    <rect x="32" y="8" width="1.5" height="48"/>
    <rect x="44" y="8" width="1.5" height="48"/>
  </g>
  <!-- highlighted "active" cell (XP/quest) -->
  <rect class="cell-active" x="33" y="33" width="11" height="11" rx="1.5"/>
  <!-- bold X mark — Excel + Quest checkmark hybrid -->
  <path class="x-mark" d="M18 14 L26 26 M26 14 L18 26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
